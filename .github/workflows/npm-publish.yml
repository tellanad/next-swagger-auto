# This workflow will run tests and then publish to npm when a release is created
name: Node.js Package

on:
  release:
    types: [published] # Changed to 'published' to ensure the release is final
  workflow_dispatch:   # This allows you to trigger the build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build --if-present
        
      - name: Run tests
        # This will no longer fail if the "test" script is missing in package.json
        run: npm test --if-present

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # This job only runs if the 'build' job succeeds
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          
      - name: Install dependencies
        run: npm ci
        
      - name: Publish to npm
        # Added --access public in case your package is scoped (e.g., @username/package)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}